<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="数字栅格地图 DRG 图幅示意">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C2F54"/>
      <stop offset="55%" stop-color="#12446F"/>
      <stop offset="100%" stop-color="#0A2948"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="100%" stop-color="#EFE7D6"/>
    </linearGradient>
    <pattern id="deskgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="sheetShadow" x="-12%" y="-12%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#00101F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#desk)"/>
  <rect width="1200" height="900" fill="url(#deskgrid)"/>

  <g transform="rotate(-1.4 600 450)" filter="url(#sheetShadow)">
    <rect x="96" y="62" width="1008" height="782" rx="4" fill="#E5DCC9"/>
    <rect x="86" y="52" width="1008" height="782" rx="4" fill="url(#paper)" stroke="#D8CCB6" stroke-width="2"/>
    <rect x="112" y="78" width="956" height="730" fill="none" stroke="#6D7C8C" stroke-width="2"/>
    <rect x="122" y="88" width="936" height="710" fill="none" stroke="#9AA8B4" stroke-width="0.8"/>

    <!-- grid -->
    <g stroke="#8FA6B8" stroke-opacity="0.34" stroke-width="0.7">
      <path d="M122 168.7H1058M122 249.3H1058M122 330H1058M122 410.7H1058M122 491.3H1058M122 572H1058M122 652.7H1058M122 733.3H1058"/>
      <path d="M215.6 88V798M309.2 88V798M402.8 88V798M496.4 88V798M590 88V798M683.6 88V798M777.2 88V798M870.8 88V798M964.4 88V798"/>
    </g>

    <!-- contour lines -->
    <g fill="none" stroke="#B8996F" stroke-width="1.5" stroke-opacity="0.85">
      <path d="M170 200c55-44 118-38 156 6s34 86-8 112-98 12-122-28-8-62 22-84 78-10 96 16"/>
      <path d="M182 218c42-33 92-27 120 8s22 64-8 84-74 8-92-24-2-46 18-60 54-6 66 12"/>
      <path d="M200 240c28-20 60-14 76 8s10 38-8 50-40 4-50-14 2-30 16-36 30 0 36 10"/>
      <path d="M360 180c60-30 118-16 146 24s20 74-18 96-92 10-116-26-10-64 22-84"/>
      <path d="M380 200c44-18 84-8 100 20s10 48-16 62-62 4-78-20-2-46 18-54"/>
      <path d="M420 236c24-10 48-4 56 12s4 26-10 32-32 0-40-12 0-24 10-28"/>
      <path d="M700 520c70-44 150-40 190 8s26 100-26 130-130 18-164-30-12-84 26-102"/>
      <path d="M720 545c54-30 112-20 138 18s14 66-18 86-88 10-112-22-8-58 20-72"/>
      <path d="M250 600c66-30 132-16 156 26s10 72-34 88-106 0-126-34-2-60 32-72"/>
    </g>

    <!-- river -->
    <path d="M760 100c-20 70-10 120 26 168s58 88 52 140-38 82-54 118-12 62 4 94" fill="none" stroke="#6FA6C8" stroke-width="11" stroke-linecap="round" stroke-opacity="0.92"/>
    <path d="M760 100c-20 70-10 120 26 168s58 88 52 140-38 82-54 118-12 62 4 94" fill="none" stroke="#BBD9EA" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>

    <!-- roads -->
    <g fill="none" stroke="#B85F45" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9">
      <path d="M150 430c110-18 178-6 250 34s130 52 210 44 150-34 238-12"/>
      <path d="M300 140c22 94 38 154 84 210s98 96 112 170 4 142-14 216"/>
      <path d="M620 88c12 84 36 128 84 166"/>
    </g>
    <g fill="none" stroke="#D8A07E" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.9">
      <path d="M150 430c110-18 178-6 250 34s130 52 210 44 150-34 238-12"/>
      <path d="M300 140c22 94 38 154 84 210s98 96 112 170 4 142-14 216"/>
    </g>

    <!-- settlement -->
    <g fill="#D9C6A8" stroke="#8A7A62" stroke-width="1.2">
      <rect x="560" y="360" width="54" height="34" rx="2"/>
      <rect x="624" y="352" width="38" height="26" rx="2"/>
      <rect x="570" y="404" width="40" height="24" rx="2"/>
      <rect x="626" y="392" width="52" height="34" rx="2"/>
      <rect x="540" y="334" width="26" height="18" rx="2"/>
    </g>
    <g fill="#B85F45">
      <circle cx="560" cy="360" r="2.6"/><circle cx="624" cy="352" r="2.6"/><circle cx="626" cy="392" r="2.6"/>
    </g>

    <!-- labels -->
    <g font-family="system-ui, -apple-system, sans-serif" fill="#4D5B69">
      <text x="140" y="128" font-size="17" letter-spacing="1.2">图幅号 J-50-XX</text>
      <text x="860" y="128" font-size="17" text-anchor="end">1:10000</text>
      <text x="140" y="770" font-size="13" fill="#6C7A86">等高线 · 水系 · 居民地 · 道路</text>
      <text x="140" y="790" font-size="11" fill="#8B979F">数字栅格地图（DRG）· 扫描纠正示意</text>
      <text x="900" y="770" font-size="12" text-anchor="end" fill="#6C7A86">1989 年版</text>
    </g>

    <!-- scale bar -->
    <g transform="translate(830 786)">
      <rect x="0" y="0" width="180" height="8" fill="#F7F2E7" stroke="#6D7C8C" stroke-width="1"/>
      <rect x="0" y="0" width="45" height="8" fill="#6D7C8C"/>
      <rect x="90" y="0" width="45" height="8" fill="#6D7C8C"/>
      <g font-family="system-ui, sans-serif" font-size="9" fill="#6C7A86">
        <text x="0" y="-5">0</text>
        <text x="88" y="-5">500</text>
        <text x="176" y="-5">1000 m</text>
      </g>
    </g>

    <!-- corner ticks -->
    <g stroke="#6D7C8C" stroke-width="2">
      <path d="M112 78h22M112 78v22M1058 78h-22M1058 78v22M112 808h22M112 808v-22M1058 808h-22M1058 808v-22"/>
    </g>
  </g>

  <!-- frame marks -->
  <g fill="none" stroke="#8FB1CE" stroke-opacity="0.5" stroke-width="1.2">
    <path d="M40 40h26M40 40v26M1160 40h-26M1160 40v26M40 860h26M40 860v-26M1160 860h-26M1160 860v-26"/>
  </g>
  <g font-family="system-ui, sans-serif" fill="#9FC0D8" font-size="11" letter-spacing="1.4">
    <text x="40" y="886">DRG / RASTER MAP SHEET</text>
    <text x="1160" y="886" text-anchor="end">INNER MONGOLIA ACHIEVEMENT MARKET</text>
  </g>
</svg>
